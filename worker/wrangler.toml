# Cloudflare Worker for game leaderboards. See README.md for setup.
name = "games-leaderboard"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Workers Logs keeps the Worker's console output and uncaught exceptions for
# a few days. Invocation logs stay off: they would record every request's
# headers, client IP included, and the Worker only ever keeps a salted hash.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
# Pages allowed to read and save scores. The localhost entries are for testing
# the games against `wrangler dev`.
ALLOWED_ORIGINS = "https://games.michaelwarkentin.com,http://localhost:8000,http://127.0.0.1:8000"
# Pages a Turnstile check for Letterfield's survey may come from (see
# TURNSTILE.md). It only matters once the TURNSTILE_SECRET secret is set; for
# `wrangler dev` with Cloudflare's test keys, override it in .dev.vars.
TURNSTILE_HOSTNAMES = "games.michaelwarkentin.com"
# "true" turns away survey joins without a Turnstile pass. Until then, with
# TURNSTILE_SECRET set, passes are handed out and joins without one are
# only counted (the Atlas's `unpassed`), so it can be switched on in steps.
TURNSTILE_REQUIRED = "false"

[[d1_databases]]
binding = "DB"
database_name = "games-leaderboard"
# The database is created and managed with OpenTofu, outside this repo. The id
# isn't a secret.
database_id = "14348cc4-b12d-47a1-bf6e-8190a4898eb3"
migrations_dir = "migrations"

# Letterfield's survey log: every word charted, copied there by the survey's
# sectors (see "The log" in SURVEY.md). A database of its own, so its batches
# and a busy day's reads never queue with score saves, and so it can be
# emptied or rebuilt without going near scores. Made with OpenTofu in
# mwarkentin/infra (cloudflare.tf, output survey_log_database_id).
[[d1_databases]]
binding = "LOG_DB"
database_name = "games-survey-log"
database_id = "c1bc9a0a-5e40-4116-85be-9544a9fae77d"
migrations_dir = "migrations-log"

# War rooms: one Durable Object per room, holding the game and every player's
# WebSocket (see src/war.js). Every class here is SQLite-backed.
[[durable_objects.bindings]]
name = "WAR_ROOMS"
class_name = "WarRoom"

# Letterfield's shared survey: one Durable Object per sector of the map and
# one Atlas for the world's totals, each with its own SQLite storage. See
# SURVEY.md.
[[durable_objects.bindings]]
name = "SECTORS"
class_name = "Sector"

[[durable_objects.bindings]]
name = "ATLAS"
class_name = "Atlas"

# Migrations run once each, in order, and a deployed tag can't change: add a
# new tag for each new class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WarRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sector", "Atlas"]

# Letterfield's survey limits each player's address, hashed with IP_SALT,
# across every sector (see "Bots" in SURVEY.md). Counts are kept per
# Cloudflare location and are approximate, which is enough to stop one
# script charting the world. Periods can only be 10 or 60 seconds, and each
# namespace_id must be unique in the account.
[[ratelimits]]
name = "SURVEY_CLAIMS"     # words claimed: 6 a minute, counted over a minute so a quick few all count
namespace_id = "7301"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "SURVEY_JOINS"      # sockets opened: a player roaming opens about 10 an hour
namespace_id = "7302"

  [ratelimits.simple]
  limit = 120
  period = 60

# Letterfield's definitions (src/define.js): new words looked up on
# Wiktionary or Wikipedia, per address. Words already kept in D1 don't count.
[[ratelimits]]
name = "DEFINE_LOOKUPS"
namespace_id = "7303"

  [ratelimits.simple]
  limit = 20
  period = 60

# Worker Previews: every pull request that touches worker/ gets its own copy
# of this Worker at https://pr-<number>-games-leaderboard.mwarkentin.workers.dev
# (see "Previews" in README.md). A Preview takes nothing above but the code,
# compatibility date, Durable Object classes and migrations, and observability,
# so its variables and bindings are set again here.
[previews.vars]
ALLOWED_ORIGINS = "https://games.michaelwarkentin.com,http://localhost:8000,http://127.0.0.1:8000"
TURNSTILE_HOSTNAMES = "games.michaelwarkentin.com"
TURNSTILE_REQUIRED = "false"
# Words one address can chart on a Preview each UTC day: 1,000 rather than
# production's 300 (DAILY_CLAIMS in src/survey.js), so a test can chart
# several whole territories in a day.
SURVEY_DAILY_CLAIMS = "1000"

# Previews share one database of test scores, never production's. It's made
# with OpenTofu in mwarkentin/infra, and wrangler.previews-migrations.toml
# names it too, for applying migrations.
[[previews.d1_databases]]
binding = "DB"
database_name = "games-leaderboard-previews"
database_id = "9e59972d-4633-4451-8485-9988082c9f38"
migrations_dir = "migrations"

# Previews' survey logs share one test database too, never production's.
[[previews.d1_databases]]
binding = "LOG_DB"
database_name = "games-survey-log-previews"
database_id = "81cc1740-76a6-4c32-bfde-95477df4ddbf"
migrations_dir = "migrations-log"

# Each Preview gets Durable Objects of its own, empty to start: its rooms and
# survey never touch production's.
[[previews.durable_objects.bindings]]
name = "WAR_ROOMS"
class_name = "WarRoom"

[[previews.durable_objects.bindings]]
name = "SECTORS"
class_name = "Sector"

[[previews.durable_objects.bindings]]
name = "ATLAS"
class_name = "Atlas"

# Counted apart from production's (Previews share these). The same limits,
# except claims: 60 a minute rather than 6, so a test can chart a whole
# territory in a few minutes. Each socket's own limit (CLAIM_BURST and
# CLAIM_REFILL_MS in src/survey.js, about 40 a minute) and the daily cap per
# address still hold, so a person playing a preview meets the same survey.
[[previews.ratelimits]]
name = "SURVEY_CLAIMS"
namespace_id = "7311"

  [previews.ratelimits.simple]
  limit = 60
  period = 60

[[previews.ratelimits]]
name = "SURVEY_JOINS"
namespace_id = "7312"

  [previews.ratelimits.simple]
  limit = 120
  period = 60

[[previews.ratelimits]]
name = "DEFINE_LOOKUPS"
namespace_id = "7313"

  [previews.ratelimits.simple]
  limit = 20
  period = 60
