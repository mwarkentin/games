# Only for applying migrations to the Previews' databases:
#   npx wrangler@4.151.0 d1 migrations apply games-leaderboard-previews --remote \
#     --config wrangler.previews-migrations.toml
#   npx wrangler@4.151.0 d1 migrations apply games-survey-log-previews --remote \
#     --config wrangler.previews-migrations.toml
# wrangler d1 reads databases from the top level of a config file, never from
# previews, so this names the ones in wrangler.toml's previews.d1_databases.
# Keep the two in step.
name = "games-leaderboard"

[[d1_databases]]
binding = "DB"
database_name = "games-leaderboard-previews"
database_id = "9e59972d-4633-4451-8485-9988082c9f38"
migrations_dir = "migrations"

[[d1_databases]]
binding = "LOG_DB"
database_name = "games-survey-log-previews"
database_id = "81cc1740-76a6-4c32-bfde-95477df4ddbf"
migrations_dir = "migrations-log"
