# Page previews: every pull request's own build of the site, served as static
# assets by a Worker Preview of this Worker at
# https://pr-<number>-games-preview.mwarkentin.workers.dev. The Preview
# workflow (.github/workflows/preview.yml) builds _site/, points it at the
# pull request's Worker Preview with scripts/point_preview.py, then runs
# `wrangler preview` here. See "Previews" in AGENTS.md.
#
# This Worker is never deployed to production. The live site is GitHub Pages,
# moving to games-site (site/wrangler.toml, see site/README.md), a Worker of
# its own with these same asset rules, so no preview can become the live
# site. It has no code, only assets, so it needs no bindings or secrets.
name = "games-preview"
compatibility_date = "2026-10-01"

# The same rules as games-site's: /war is served from war.html, /war.html
# redirects to /war, an address with no file gets 404.html with a 404, and
# the built _headers sets each path's caching. Wrangler uploads the
# branch's own _site/ for each Preview.
[assets]
directory = "../_site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Previews take nothing from the top level but the assets and compatibility
# date, and there's nothing else to set.
[previews]
