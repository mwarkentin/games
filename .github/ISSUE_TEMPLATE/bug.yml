name: Bug
description: Something in a game isn't working the way it should.
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      # Every game in README.md; tests/test_build.py checks.
      options:
        - Air Traffic Controller
        - Doodle Chomp
        - Funnels & Buckets
        - Letterfield
        - Letterfield survey log
        - War
        - The site (home page, colophon, changelogs)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
