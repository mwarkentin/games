name: Deploy leaderboard worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/leaderboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until mwarkentin/infra has set the CLOUDFLARE_ACCOUNT_ID
    # variable and the CLOUDFLARE_API_TOKEN and IP_SALT secrets (see
    # worker/README.md).
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply database migrations
        run: |
          npx --yes wrangler@4.151.0 d1 migrations apply games-leaderboard --remote
          npx --yes wrangler@4.151.0 d1 migrations apply games-survey-log --remote
      # The salt goes up with the deploy, so the new version never runs
      # without it. The file lives outside the checkout, only until wrangler
      # has read it. TURNSTILE_SECRET is optional: until mwarkentin/infra
      # sets it, the survey takes joins without a pass (see TURNSTILE.md).
      - name: Deploy worker
        env:
          IP_SALT: ${{ secrets.IP_SALT }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          test -n "$IP_SALT" || { echo "::error::The IP_SALT secret is missing; see worker/README.md"; exit 1; }
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n --arg salt "$IP_SALT" --arg turnstile "$TURNSTILE_SECRET" \
            '{IP_SALT: $salt} + (if $turnstile == "" then {} else {TURNSTILE_SECRET: $turnstile} end)' > "$secrets"
          npx --yes wrangler@4.151.0 deploy --secrets-file "$secrets"
