name: Test

# Pull requests run here on pull_request, and main on push. A branch pushed
# before it has a pull request (as agent sessions do) runs on push too, but
# once the branch has an open pull request its push runs skip, since the
# pull_request run tests the same commit.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it
# supersedes. Runs on main always finish.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether this run has anything to do, and which pytest tests it runs over
  # how many shards. A pull request runs the tests its changed files need
  # (scripts/select_tests.py): one that only changes Letterfield runs
  # Letterfield's tests and those covering every game, not War's, and one
  # that changes anything shared runs them all. A branch pushed before it has
  # a pull request runs what its changes from main need, the same way, so a
  # session's first push gets the narrow run its pull request would. main
  # always runs them all.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      pytest: ${{ steps.plan.outputs.pytest }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # a branch's changes from main, for its push runs
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq length)
            if [ "$open" != 0 ]; then
              echo "This branch has an open pull request, whose run tests this commit."
              run=false
            fi
          fi
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$changed"
            plan=$(python3 scripts/select_tests.py < "$changed")
          elif [ "$REF" != refs/heads/main ]; then
            git fetch --quiet origin main
            plan=$(python3 scripts/select_tests.py --base origin/main)
          else
            plan=$(python3 scripts/select_tests.py --all)
          fi
          echo "$plan" | python3 -m json.tool
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "pytest=$(jq -r .pytest <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "tests=$(jq -r '.tests | join(" ")' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c .shards <<< "$plan")" >> "$GITHUB_OUTPUT"

  # The Playwright suite, split into shards of about equal time by
  # pytest-split from the durations in .test_durations, each shard over
  # four workers with pytest-xdist (see "Commands" in AGENTS.md). The plan
  # job picks the tests and how many shards they need, up to three.
  pytest:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.pytest == 'true'
    name: pytest (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tests build the site, which reads git history
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # Only Chromium's headless shell, which is all headless tests launch:
      # half the size of full Chromium, so the cache restores faster.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: ubuntu-latest already has every library Chromium
      # needs, and apt-get spent 13-28 s on fonts for scripts no game uses
      # (CJK, Thai). If the runner image ever drops a library, Chromium
      # fails to launch and names it; put --with-deps back then.
      - name: Install Chromium
        run: uv run playwright install --only-shell chromium
      - name: Run tests
        env:
          TESTS: ${{ needs.plan.outputs.tests }} # empty for the whole suite
        run: >-
          uv run pytest -n 4 --dist worksteal
          --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} --splitting-algorithm least_duration
          $TESTS

  # The one check main requires before a pull request merges (see "Merging"
  # in AGENTS.md). It passes once every shard, the lint job, the worker job
  # and the share job have, and fails if any failed or was cancelled. A job may be skipped
  # only when the plan says it had nothing to do: pytest for a pull request
  # that changes no file pytest reads, everything for a push run whose
  # branch has an open pull request. It always reports, so the check never
  # waits forever; a run cancelled by a newer push leaves it cancelled, on a
  # commit that's no longer the pull request's head.
  #
  # Only pull_request runs call it "test". A branch's push runs call it
  # "test (push)": the push run of a branch with an open pull request
  # skips everything and passes in seconds, and under the same name, on the
  # same commit, it would satisfy the requirement while the pull request's
  # own run was still going, or after it failed.
  test:
    needs: [plan, pytest, lint, worker, share]
    if: ${{ !cancelled() }}
    name: ${{ github.event_name == 'pull_request' && 'test' || 'test (push)' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RUN: ${{ needs.plan.outputs.run }}
          WANTS_PYTEST: ${{ needs.plan.outputs.pytest }}
          PLAN: ${{ needs.plan.result }}
          PYTEST: ${{ needs.pytest.result }}
          LINT: ${{ needs.lint.result }}
          WORKER: ${{ needs.worker.result }}
          SHARE: ${{ needs.share.result }}
        run: |
          echo "plan: $PLAN (run: $RUN, pytest: $WANTS_PYTEST), pytest: $PYTEST, lint: $LINT, worker: $WORKER, share: $SHARE"
          [ "$PLAN" = success ] || { echo "The plan job didn't succeed."; exit 1; }
          # passed NAME RESULT WANTED: the job succeeded, or was skipped
          # because the plan didn't want it.
          passed() {
            [ "$2" = success ] && return
            [ "$2" = skipped ] && [ "$3" != true ] && return
            echo "$1: $2"; return 1
          }
          ok=true
          passed pytest "$PYTEST" "$([ "$RUN" = true ] && echo "$WANTS_PYTEST")" || ok=false
          passed lint "$LINT" "$RUN" || ok=false
          passed worker "$WORKER" "$RUN" || ok=false
          passed share "$SHARE" "$RUN" || ok=false
          $ok

  # ruff, Biome, shellcheck and actionlint, as scripts/lint.sh runs them
  # (see "Linting" in AGENTS.md). It only reports: `scripts/lint.sh --fix`
  # fixes what it can, locally. It doesn't wait for plan's tests, only for
  # whether this run has anything to do.
  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RUFF_OUTPUT_FORMAT: github # annotations on the pull request's lines
      UV_LOCKED: 1 # fail if uv.lock is out of date, as uv sync --locked does
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint
        run: scripts/lint.sh

  worker:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the tests use node:sqlite
      - name: Test the leaderboard worker
        run: node --disable-warning=ExperimentalWarning --test "worker/test/*.test.js"

  share:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # resvg's wasm, pinned in share/package-lock.json.
      - name: Install the share Worker's dependency
        run: npm ci
        working-directory: share
      - name: Test the share Worker
        run: node --disable-warning=ExperimentalWarning --test "share/test/*.test.js"
